[project]
name = "gotcha"
version = "0.1.0"
description = "Aplicativo local para importar exames de certificação e treinar com simulados."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pypdfium2>=4.30",
  "openpyxl>=3.1",
  "nh3>=0.2.18",
]

[project.scripts]
gotcha = "gotcha.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-openpyxl>=3.1.5.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gotcha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["samples: usa arquivos reais em samples/ (ignorados no CI)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
